<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toronto's Lost Rivers</title>
    <!--Mapbox CDN link-->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css' rel='stylesheet' />
    <!-- link to CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Link to bootstrap style sheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>



<body style="background-color:rgb(54, 51, 65);"> 
    <!-- centered heading and body text -->
    <div class="container-md text-center p-4">
        <div class="row">
            <div class="col-md">
            </div>
            <div class="col-md">
                <!-- give text classes to edit in CSS -->
                <h1 class="heading-text">Toronto's Lost Rivers</h1> 
                <p class="body-text">Due to urban development, a once sprawling drainage basin has been limited to designated rivers and ravines, as natural hydrological processes are now controlled by humans through reservoirs and sewer systems.</p>
            </div>
            <div class="col-md">
            </div>
        </div>
    </div>
    <div class="container-md">
        <!-- bootstrap center map through 3 columns to match text -->
         <!-- i have no clue why the map doesn't align exactly with the text and goes to the left when shrinking the window, but i'm just going to assume this is the nature of a map window -->
        <div class="row">
            <div class="col-md">
            </div>
            <div class="col-md">
                <div id="my-map" class="map-container"></div>
                <script src="script.js"></script>
            </div>
            <div class="col-md">
            </div>
        </div>
    </div>
</body>

</html>
